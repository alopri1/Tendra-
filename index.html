const PH=[`Phase 1 · Isométrie : activer et charger`,`Phase 2 · Force lente : renforcer`,`Phase 3 · Énergie : explosivité et restitution`];
const OB={ren:`Renforcer`,mob:`Mobilité et souplesse`,perf:`Explosivité`,prev:`Prévenir les blessures`};
const QS=[`Douleur vive et soudaine, ou « claquement » ressenti récemment`,`Gonflement, rougeur ou chaleur importants`,`Impossible de t’appuyer dessus ou de le bouger normalement`,`Engourdissement ou fourmillements`,`Blessure ou opération il y a moins de 3 mois`,`Douleur intense la nuit ou au repos`];
const OBS=p=>[].concat(p.obj||['ren']);
const phase=w=>{let p=w<=2?0:w<=4?1:2;if(OBS(S.profile).every(o=>o==='mob'))p=Math.min(p,1);return p};
const TY={I:`Isométrie`,L:`Force lente`,E:`Excentrique`,P:`Pliométrie`,M:`Mobilité`,C:`Chaîne et stabilité`};
const TP={
ren:[['IIM','ICM','IIC','ICM','IIM','ICC'],['LLC','LEM','LLC','ELC','LLM','LEC'],['LLE','LEC','LLC','ELL','LEC','LLM']],
mob:[['MMI','MMC','MMI','MCM','MMI','MMC'],['MML','MMI','MCL','MMC','MML','MMI'],['MML','MMI','MCL','MMC','MML','MMI']],
perf:[['IIC','IMC','IIM','ICM','IIC','IMC'],['LPC','LLP','LPM','LCP','LLP','LPC'],['PLP','LPC','PPL','LCP','PLP','LPM']],
prev:[['IMC','IIC','IMC','ICM','IIC','IMC'],['LEC','LMC','ELC','LIC','LEM','LCM'],['LEC','LPC','ELC','LCM','LEP','LCC']]};
const OC={ren:'r',mob:'m',perf:'p',prev:'v'};
const mix=(pr,ph,di)=>{const os=OBS(pr),t=os.map(o=>(TP[o]||TP.ren)[ph][Math.min(di,5)]),n=t.length;if(n===1)return[...t[0]].map(ch=>[ch,os[0]]);const r=[];for(let k=0;k<4;k++){const q=t[k%n];r.push([q[(Math.floor(k/n)+k%n)%q.length],os[k%n]])}return r};
const items=d=>{const pr=S.profile,cy=Math.floor(d/42),w=Math.floor((d%42)/7)+1,ph=phase(w),di=d%7,sl=mix(pr,ph,di);
const mx=pr.age>=50?2:pr.lvl==='deb'?(ph==2?2:1):pr.lvl==='adv'?4:3,tg=Math.min(mx,ph+1+cy+(pr.lvl==='adv'?1:0)),used=[],l=[];
sl.forEach(([t,ob],k)=>{const c=T[pr.tendon].x.filter(e=>e.t===t&&e.l<=mx&&!used.includes(e.n));if(!c.length)return;
const sc=e=>(e.o.includes(OC[ob]||'r')?60:0)+e.w*10+(e.l===tg?25:e.l===tg-1?10:0);const cc0=c.filter(e=>e.o.includes(OC[ob]||'r')),cc=cc0.length>=2?cc0:c;cc.sort((u,v)=>sc(v)-sc(u));const top=cc.slice(0,Math.min(3,cc.length)),e=top[(w+di+k)%top.length];used.push(e.n);
l.push([e.n,(pr.lvl==='deb'||pr.age>=50)?e.d.replace(/^(\d+) ×/,(m,n)=>`${Math.max(2,n-1)} ×`):e.d,`${TY[t]} · ${e.c}`])});

return l};
